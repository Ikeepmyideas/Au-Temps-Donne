    <script>
function fetchServices() {
        const url = new URL('http://127.0.0.1:8000/api/admin/services');

        fetch(url, {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Problème de réponse réseau');
            }
            return response.json();
        })
        .then(services => {
            console.log("Services récupérés:", services);
            displayServices(services);
        })
        .catch(error => {
            console.error("Il y a eu un problème avec l'opération fetch: " + error.message);
        });
    }

    function displayServices(services) {
        const selectElement = document.getElementById('besoin');

        if (!selectElement) {
            console.error("Element 'besoin' introuvable.");
            return;
        }

        selectElement.innerHTML = '';

        const defaultOption = document.createElement('option');
        defaultOption.value = "";
        defaultOption.textContent = "Sélectionnez un service";
        selectElement.appendChild(defaultOption);

        services.forEach(service => {
            const option = document.createElement('option');
            option.value = service.nom; 
            option.textContent = service.nom;
            selectElement.appendChild(option);
        });
    }

    fetchServices();

document.addEventListener('DOMContentLoaded', fetchServices);
        var x=document.getElementById('register');

            document.getElementById('volunteer-button').style.color = '#F96262'; 
        }
        
        function showPage(pageNumber) {
            document.getElementById("page1").style.display = (pageNumber === 1) ? "block" : "none";
            document.getElementById("page2").style.display = (pageNumber === 2) ? "block" : "none";
            document.getElementById("page3").style.display = (pageNumber === 3) ? "block" : "none";
            document.getElementById("page4").style.display = (pageNumber === 4) ? "block" : "none";
            document.getElementById("page5").style.display = (pageNumber === 5) ? "block" : "none";

        }
    
        document.getElementById("confirmPassword-v").addEventListener("input", function () {
            var password = document.getElementById("password-v").value;
            var confirmPassword = this.value;
            var message = document.getElementById("passwordMatchMessage");
    
            if (password === confirmPassword) {
                message.innerHTML = "Les mots de passe correspondent.";
                message.style.color = "green";
            } else {
                message.textContent = "Les mots de passe ne correspondent pas.";
                message.style.color = "red";
            }
        });

        document.getElementById("confirmPassword").addEventListener("input", function () {
            var password = document.getElementById("password").value;
            var confirmPassword = this.value;
            var message = document.getElementById("passwordMatchMessage2");
    
            if (password === confirmPassword) {
                message.innerHTML = "Les mots de passe correspondent.";
                message.style.color = "green";
            } else {
                message.textContent = "Les mots de passe ne correspondent pas.";
                message.style.color = "red";
            }
        });

        function evaluatePasswordStrength(password) {
            let score = 0;
        
            // Longueur minimale
            if (password.length >= 8) {
                score += 20;
            }
        
            // Présence de chiffres
            if (/\d/.test(password)) {
                score += 20;
            }
        
            // Présence de lettres majuscules
            if (/[A-Z]/.test(password)) {
                score += 20;
            }
        
            // Présence de caractères spéciaux
            if (/[\W_]/.test(password)) {
                score += 20;
            }
        
            // Présence de lettres minuscules
            if (/[a-z]/.test(password)) {
                score += 20;
            }
        
            return score;
        }

        // Fonction pour mettre à jour la barre de progression
        function updateProgressBar(password) {
            const progressBar = document.getElementById("passwordStrength");
        
            const strength = evaluatePasswordStrength(password);
        
            progressBar.style.width = strength + "%";
        
            if (strength < 40) {
                progressBar.style.backgroundColor = "#FF5050"; // Rouge
            } else if (strength < 70) {
                progressBar.style.backgroundColor = "#FFD700"; // Jaune
            } else {
                progressBar.style.backgroundColor = "#4CAF50"; // Vert
            }
        }

        // Fonction pour mettre à jour la barre de progression (volunteer)
        function updateProgressBar2(password) {
            const progressBar = document.getElementById("passwordStrength2");
        
            const strength = evaluatePasswordStrength(password);
        
            progressBar.style.width = strength + "%";
        
            if (strength < 40) {
                progressBar.style.backgroundColor = "#FF5050"; // Rouge
            } else if (strength < 70) {
                progressBar.style.backgroundColor = "#FFD700"; // Jaune
            } else {
                progressBar.style.backgroundColor = "#4CAF50"; // Vert
            }
        }
    
         document.getElementById("password-v").addEventListener("input", function () {
            updateProgressBar(this.value);
        });

        document.getElementById("password").addEventListener("input", function () {
            updateProgressBar2(this.value);
        });
        
    </script>
    <script>

function toggleJustificatif() {
    const permisConduireOui = document.getElementById('permis_conduire_oui');
    const permisConduireNon = document.getElementById('permis_conduire_non');
    const justificatifGroup = document.getElementById('justificatif-group');

    if (permisConduireOui.checked) {
        justificatifGroup.style.display = 'block';
    } else if (permisConduireNon.checked) {
        justificatifGroup.style.display = 'none';
    } else {
        justificatifGroup.style.display = 'none';
    }
}

// Fonction pour soumettre le formulaire
function submitForm() {
    // Récupérer les données du formulaire
    const formData = new FormData();
    formData.append('email', document.getElementById('email').value);
    formData.append('prenom', document.getElementById('firstName').value);
    formData.append('nom', document.getElementById('lastName').value);
    formData.append('mot_de_passe', document.getElementById('password').value);
    formData.append('telephone', document.getElementById('phoneNumber').value);
    formData.append('genre', document.getElementById('genre').value);
    formData.append('adresse', document.getElementById('address').value);
    formData.append('ville', document.getElementById('ville').value);
    formData.append('code_postal', document.getElementById('postalCode').value);
    formData.append('jour', document.getElementById('jour').value);
    formData.append('mois', document.getElementById('mois').value);
    formData.append('annee', document.getElementById('annee').value);
    const permisConduire = document.getElementById('permis_conduire_oui').checked ? 'oui' : 'non';
    formData.append('permis_conduire', permisConduire);
    formData.append('langues', document.getElementById('langues').value);
    formData.append('qualites', document.getElementById('qualites').value);
    formData.append('competences', document.getElementById('competences').value);
    formData.append('message_candidature', document.getElementById('message_candidature').value);

    const justificatifInput = document.getElementById('justificatif_permis');
        if (justificatifInput.files.length > 0) {
            formData.append('justificatif_permis', justificatifInput.files[0]);
    }
    const casierInput = document.getElementById('casier');
         if (casierInput.files.length > 0) {
            formData.append('casier_judiciaire', casierInput.files[0]);
    }


    formData.append('date_de_naissance', `${formData.get('annee')}-${formData.get('mois')}-${formData.get('jour')}`);

    // Envoyer les données à l'API back-end
    fetch('http://127.0.0.1:8000/api/volunteer/registerVolunteer', {
        method: 'POST',
        body: formData,
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Erreur lors de la soumission du formulaire');
        }
        return response.json();
    })
    .then(data => {
        console.log('Formulaire soumis avec succès:', data);
        window.location.href = 'signup_done.html';
    })
    .catch(error => {
        console.error('Erreur lors de la soumission du formulaire:', error);
    });
}
